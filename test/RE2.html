<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Evil Magazine</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #111;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation bar */
    header {
      box-sizing: border-box; /* ✅ Fixes the overflow issue */
      display: flex;
      justify-content: flex-end; /* ✅ only right side */
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #f00;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #fff;
    }

    /* Main content with Resident Evil background */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMHlxNXpjNDkwcTBsdGM0OXU0Nmg2dWF0dXgyeTN5MTI5emgwaHpkNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/YsaQaKWwZEFyg/giphy.gif') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    /* Title overlay */
    .title {
      position: relative;
      z-index: 5;
      font-size: 3em;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #fff;
      text-shadow: 2px 2px 10px #000;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="RE2.html">Home</a>
      <a href="about.html">About</a>
      <a href="news.html">News</a>
    </nav>
  </header>

  <div class="main">
    <div class="title">Resident Evil</div>
  </div>
</body>
</html>
